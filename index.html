<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мережеві Шашки P2P</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body {
            background-color: #1a202c;
            color: #e2e8f0;
            font-family: 'Inter', sans-serif;
            touch-action: manipulation;
        }

        .board-container {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            width: 100%;
            max-width: 500px;
            aspect-ratio: 1 / 1;
            border: 4px solid #4a5568;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .cell {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .cell-light { background-color: #DDB88C; }
        .cell-dark { background-color: #6B4423; }

        .piece {
            width: 80%;
            height: 80%;
            border-radius: 50%;
            transition: all 0.2s ease-in-out;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            user-select: none;
        }

        .piece-white {
            background-color: #f8fafc;
            box-shadow: inset 0 -4px 6px rgba(0,0,0,0.2), 0 4px 6px rgba(0,0,0,0.4);
            border: 2px solid #cbd5e1;
        }

        .piece-black {
            background-color: #1f2937;
            box-shadow: inset 0 -4px 6px rgba(0,0,0,0.6), 0 4px 6px rgba(0,0,0,0.6);
            border: 2px solid #111827;
            color: white;
        }

        .piece.selected {
            border: 3px solid #3b82f6;
            transform: scale(1.1);
            box-shadow: 0 0 15px #3b82f6;
        }

        .must-jump {
            animation: pulse-red 1.5s infinite;
        }

        .valid-move {
            width: 30%;
            height: 30%;
            background-color: rgba(59, 130, 246, 0.6);
            border-radius: 50%;
            cursor: pointer;
        }

        .valid-jump-target {
            width: 30%;
            height: 30%;
            background-color: rgba(239, 68, 68, 0.6);
            border-radius: 50%;
            cursor: pointer;
        }

        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .king-crown {
            font-size: 1.2rem;
            line-height: 1;
        }

        /* Приховування скролбару */
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Головне меню -->
    <div id="menu-screen" class="w-full max-w-md bg-gray-800 p-8 rounded-xl shadow-2xl text-center space-y-6">
        <h1 class="text-4xl font-bold text-white mb-2">Шашки P2P</h1>
        <p class="text-gray-400 text-sm">Грайте з друзями безпосередньо у браузері</p>
        
        <button onclick="startLocalGame()" class="w-full py-3 bg-purple-600 hover:bg-purple-500 text-white font-bold rounded-lg transition-colors shadow-lg">
            Грати локально (На 1 екрані)
        </button>

        <div class="flex items-center justify-center space-x-2 my-4">
            <hr class="w-1/3 border-gray-600">
            <span class="text-gray-500 text-sm font-bold">АБО МЕРЕЖА</span>
            <hr class="w-1/3 border-gray-600">
        </div>

        <button onclick="createGame()" class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-lg transition-colors">
            Створити гру
        </button>

        <div class="flex items-center justify-center space-x-2 my-4">
            <hr class="w-1/3 border-gray-600">
            <span class="text-gray-500 text-sm">АБО</span>
            <hr class="w-1/3 border-gray-600">
        </div>

        <div class="space-y-3">
            <input type="text" id="join-pin" placeholder="Введіть код гри" maxlength="5" 
                class="w-full py-3 px-4 bg-gray-700 text-white border border-gray-600 rounded-lg text-center text-xl tracking-widest uppercase focus:outline-none focus:border-emerald-500">
            <button onclick="joinGame()" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-lg transition-colors shadow-lg">
                Приєднатися
            </button>
        </div>
    </div>

    <!-- Лобі (Очікування) -->
    <div id="lobby-screen" class="hidden w-full max-w-md bg-gray-800 p-8 rounded-xl shadow-2xl text-center space-y-6">
        <h2 class="text-2xl font-bold text-white">Кімната створена!</h2>
        <p class="text-gray-300">Ваш код для запрошення:</p>
        <div class="text-5xl font-mono font-bold text-blue-400 tracking-widest my-4 uppercase" id="lobby-pin">-----</div>
        
        <p class="text-sm text-gray-400">Або надішліть це посилання:</p>
        <div class="flex">
            <input type="text" id="invite-link" readonly class="w-full p-2 bg-gray-900 border border-gray-600 rounded-l-lg text-sm text-gray-300 focus:outline-none">
            <button onclick="copyLink()" class="px-4 bg-blue-600 hover:bg-blue-500 rounded-r-lg text-white font-bold transition">Копіювати</button>
        </div>
        
        <div class="mt-6 flex justify-center items-center space-x-2 text-yellow-400">
            <svg class="animate-spin h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
            <span>Очікування суперника...</span>
        </div>
    </div>

    <!-- Ігровий екран -->
    <div id="game-screen" class="hidden w-full max-w-xl flex-col items-center space-y-4">
        <div class="w-full flex justify-between items-center bg-gray-800 p-4 rounded-xl shadow-md">
            <div id="player-color-badge" class="px-4 py-2 rounded-lg font-bold text-sm bg-gray-700">Ви: Білі</div>
            <div id="turn-indicator" class="text-xl font-bold text-blue-400">Хід білих</div>
            <div class="text-gray-400 text-sm font-mono uppercase" id="game-pin-display">Код: -----</div>
        </div>

        <div id="board" class="board-container"></div>
    </div>

    <!-- Модальне вікно (Заміна alert) -->
    <div id="modal" class="fixed inset-0 bg-black bg-opacity-70 hidden flex justify-center items-center z-50">
        <div class="bg-gray-800 p-8 rounded-xl max-w-sm w-full text-center shadow-2xl transform transition-all scale-100">
            <h3 id="modal-title" class="text-2xl font-bold text-white mb-4">Повідомлення</h3>
            <p id="modal-msg" class="text-gray-300 mb-6">Текст повідомлення</p>
            <button onclick="closeModal()" class="px-6 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg font-bold">ОК</button>
            <button id="restart-btn" onclick="location.reload()" class="hidden px-6 py-2 bg-green-600 hover:bg-green-500 text-white rounded-lg font-bold mt-2 w-full">На головну</button>
        </div>
    </div>

    <script>
        // --- СТАН ГРИ ---
        let boardState = []; // 0 = пусто, 1 = білі, -1 = чорні, 2 = біла дамка, -2 = чорна дамка
        let myColor = null; 
        let currentTurn = 'white';
        let selectedPiece = null;
        let multiJumpSquare = null; // Зберігає координати шашки, яка повинна продовжити бити
        let mustJumpPieces = []; // Масив шашок, які зобов'язані бити поточного ходу
        let isLocalMode = false; // Прапорець для гри на одному екрані

        // --- МЕРЕЖА (PeerJS) ---
        let peer = null;
        let conn = null;
        let currentPin = '';

        // --- ПЕРЕХОПЛЕННЯ ОБМЕЖЕНЬ БЕЗПЕКИ ---
        window.addEventListener('error', function(e) {
            if (e.message && e.message.includes('WebSocket') && e.message.includes('Canvas')) {
                showModal('Обмеження середовища 🔒', 'Мережеві функції заблоковані у режимі попереднього перегляду з міркувань безпеки.\n\nЩоб грати по мережі, завантажте цей файл та розмістіть його на GitHub Pages. А поки ви можете зіграти у Локальному режимі!');
                e.preventDefault();
            }
        });

        // --- ІНІЦІАЛІЗАЦІЯ ---
        function showScreen(id) {
            document.getElementById('menu-screen').classList.add('hidden');
            document.getElementById('lobby-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById(id).classList.remove('hidden');
        }

        function showModal(title, msg, isGameOver = false) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-msg').innerText = msg;
            document.getElementById('modal').classList.remove('hidden');
            if (isGameOver) {
                document.getElementById('restart-btn').classList.remove('hidden');
            }
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
        }

        function copyLink() {
            const link = document.getElementById('invite-link');
            link.select();
            document.execCommand('copy');
            const btn = event.target;
            btn.innerText = 'Скопійовано!';
            setTimeout(() => btn.innerText = 'Копіювати', 2000);
        }

        // --- STREAMING_CHUNK: Логіка підключення мережі... ---
        // Генерація короткого ID (як у Морському Бої)
        function generateShortID() {
            return Math.random().toString(36).substring(2, 7).toUpperCase();
        }

        // Перевірка URL на наявність запрошення
        window.onload = () => {
            const params = new URLSearchParams(window.location.search);
            const joinPin = params.get('join');
            if (joinPin && joinPin.length === 5) {
                document.getElementById('join-pin').value = joinPin.toUpperCase();
                // Невелика затримка для ініціалізації
                setTimeout(() => joinGame(joinPin.toUpperCase()), 500);
            }
        };

        // Створення гри (Хост)
        function createGame() {
            currentPin = generateShortID();
            
            // Створюємо Peer з конкретним ID
            peer = new Peer(currentPin);
            
            peer.on('open', (id) => {
                showScreen('lobby-screen');
                document.getElementById('lobby-pin').innerText = currentPin;
                
                const inviteUrl = window.location.origin + window.location.pathname + '?join=' + currentPin;
                document.getElementById('invite-link').value = inviteUrl;
            });

            peer.on('connection', (connection) => {
                conn = connection;
                setupConnection();
                
                // Хост завжди грає білими
                myColor = 'white';
                startGame(true);
                
                // Надсилаємо клієнту команду почати гру і його колір
                conn.send({ type: 'start', color: 'black', board: boardState });
            });

            peer.on('error', (err) => {
                showModal('Помилка', 'Не вдалося створити кімнату. Сервер перевантажений або код зайнятий. Спробуйте ще раз.');
                console.error(err);
            });
        }

        // Приєднання до гри (Клієнт)
        function joinGame(idToJoin = null) {
            const pin = idToJoin || document.getElementById('join-pin').value.trim().toUpperCase();
            if (pin.length !== 5) {
                showModal('Увага', 'Введіть коректний 5-значний код.');
                return;
            }

            currentPin = pin;
            peer = new Peer(); // Клієнт отримує випадковий ID

            peer.on('open', () => {
                // Підключаємось до Хоста
                conn = peer.connect(pin);
                
                conn.on('open', () => {
                    setupConnection();
                    // Чекаємо команди 'start' від хоста для ініціалізації дошки
                });

                conn.on('error', () => {
                    showModal('Помилка', 'Не вдалося приєднатися до кімнати.');
                });
            });

            peer.on('error', (err) => {
                showModal('Помилка', 'Мережева помилка. Перевірте код або підключення.');
                console.error(err);
            });
        }

        // Налаштування слухачів з'єднання для обох гравців
        function setupConnection() {
            conn.on('data', (data) => {
                if (data.type === 'start') {
                    // Клієнт отримує початковий стан
                    myColor = data.color;
                    boardState = data.board;
                    startGame(false);
                } else if (data.type === 'move') {
                    // Отримуємо хід
                    boardState = data.board;
                    currentTurn = data.nextTurn;
                    selectedPiece = null;
                    multiJumpSquare = null;
                    mustJumpPieces = [];
                    updateGameState();
                } else if (data.type === 'win') {
                    showModal('Кінець гри', `Переміг гравець (${data.winner})!`, true);
                }
            });

            conn.on('close', () => {
                showModal('Зв\'язок втрачено', 'Суперник вийшов з гри.', true);
            });
        }

        // --- STREAMING_CHUNK: Ініціалізація та відмальовка дошки... ---
        function startLocalGame() {
            isLocalMode = true;
            myColor = 'white'; // У локальній грі дошка завжди повернута від білих
            
            showScreen('game-screen');
            document.getElementById('game-pin-display').innerText = 'Локальна гра';
            
            const badge = document.getElementById('player-color-badge');
            badge.innerText = `Режим: 1 Екран`;
            badge.className = `px-4 py-2 rounded-lg font-bold text-sm border bg-purple-100 text-purple-800 border-purple-300`;

            // Стандартна розстановка шашок
            boardState = Array(8).fill().map(() => Array(8).fill(0));
            for (let y = 0; y < 8; y++) {
                for (let x = 0; x < 8; x++) {
                    if ((x + y) % 2 !== 0) {
                        if (y < 3) boardState[y][x] = -1; // Чорні
                        else if (y > 4) boardState[y][x] = 1;  // Білі
                    }
                }
            }
            updateGameState();
        }

        function startGame(isHost = true) {
            isLocalMode = false;
            showScreen('game-screen');
            document.getElementById('game-pin-display').innerText = 'Код: ' + currentPin;
            
            const badge = document.getElementById('player-color-badge');
            badge.innerText = `Ви: ${myColor === 'white' ? 'Білі' : 'Чорні'}`;
            badge.className = `px-4 py-2 rounded-lg font-bold text-sm border ${myColor === 'white' ? 'bg-gray-100 text-gray-800' : 'bg-gray-800 text-white border-gray-600'}`;

            if (isHost) {
                // Стандартна розстановка шашок
                boardState = Array(8).fill().map(() => Array(8).fill(0));
                for (let y = 0; y < 8; y++) {
                    for (let x = 0; x < 8; x++) {
                        if ((x + y) % 2 !== 0) {
                            if (y < 3) boardState[y][x] = -1; // Чорні
                            else if (y > 4) boardState[y][x] = 1;  // Білі
                        }
                    }
                }
            }
            updateGameState();
        }

        function updateGameState() {
            document.getElementById('turn-indicator').innerText = currentTurn === 'white' ? 'Хід Білих' : 'Хід Чорних';
            document.getElementById('turn-indicator').className = `text-xl font-bold ${currentTurn === 'white' ? 'text-gray-200' : 'text-gray-500'}`;
            
            checkWinCondition();
            if (isLocalMode || currentTurn === myColor) {
                updateMustJumpStatus();
            } else {
                mustJumpPieces = [];
            }
            renderBoard();
        }

        function renderBoard() {
            const board = document.getElementById('board');
            board.innerHTML = '';
            
            let possibleMoves = [];
            let possibleJumps = [];
            if (selectedPiece && (isLocalMode || currentTurn === myColor)) {
                possibleJumps = getValidJumps(selectedPiece.x, selectedPiece.y, boardState);
                if (possibleJumps.length === 0 && mustJumpPieces.length === 0) {
                    possibleMoves = getValidNormalMoves(selectedPiece.x, selectedPiece.y, boardState);
                }
            }

            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    // РОЗВОРОТ ДОШКИ: Тільки в мережевій грі за чорних
                    const isFlipped = !isLocalMode && myColor === 'black';
                    const y = isFlipped ? 7 - row : row;
                    const x = isFlipped ? 7 - col : col;

                    const cell = document.createElement('div');
                    const isDarkCell = (x + y) % 2 !== 0;
                    cell.className = `cell ${isDarkCell ? 'cell-dark' : 'cell-light'}`;
                    
                    // Обробка кліку по клітинці (для ходу)
                    cell.onclick = () => onCellClick(x, y);

                    const pieceVal = boardState[y][x];
                    
                    if (pieceVal !== 0) {
                        const piece = document.createElement('div');
                        const isWhite = pieceVal > 0;
                        const isKing = Math.abs(pieceVal) === 2;
                        
                        piece.className = `piece ${isWhite ? 'piece-white' : 'piece-black'}`;
                        if (isKing) piece.innerHTML = '<span class="king-crown">👑</span>';
                        
                        // Підсвітка обраної фігури
                        if (selectedPiece && selectedPiece.x === x && selectedPiece.y === y) {
                            piece.classList.add('selected');
                        }

                        // Підсвітка фігур, якими ОБОВ'ЯЗКОВО треба бити
                        if (currentTurn === myColor) {
                            const isMustJump = mustJumpPieces.some(p => p.x === x && p.y === y);
                            if (isMustJump) piece.classList.add('must-jump');
                        }

                        cell.appendChild(piece);
                    } else if (isDarkCell) {
                        // Малювання підказок для ходів
                        const isMoveTarget = possibleMoves.some(m => m.x === x && m.y === y);
                        const isJumpTarget = possibleJumps.some(m => m.x === x && m.y === y);
                        
                        if (isJumpTarget) {
                            const hint = document.createElement('div');
                            hint.className = 'valid-jump-target';
                            cell.appendChild(hint);
                        } else if (isMoveTarget) {
                            const hint = document.createElement('div');
                            hint.className = 'valid-move';
                            cell.appendChild(hint);
                        }
                    }
                    board.appendChild(cell);
                }
            }
        }

        // --- STREAMING_CHUNK: Логіка взаємодії (кліки)... ---
        function onCellClick(x, y) {
            if (!isLocalMode && currentTurn !== myColor) return; // Не наш хід в мережі

            const pieceVal = boardState[y][x];
            const isWhiteTurn = currentTurn === 'white';
            const isCurrentPlayerPiece = pieceVal !== 0 && (isWhiteTurn ? pieceVal > 0 : pieceVal < 0);
            
            // Якщо клікнули на свою фігуру (відповідно до поточного ходу)
            if (isCurrentPlayerPiece) {
                // Якщо є серійне взяття, ми не можемо обрати іншу фігуру
                if (multiJumpSquare && (x !== multiJumpSquare.x || y !== multiJumpSquare.y)) {
                    return; 
                }

                // Якщо є обов'язкові взяття, можна обрати ТІЛЬКИ ті фігури, які можуть бити
                if (mustJumpPieces.length > 0 && !mustJumpPieces.some(p => p.x === x && p.y === y)) {
                    return;
                }

                if (selectedPiece && selectedPiece.x === x && selectedPiece.y === y) {
                    if (!multiJumpSquare) selectedPiece = null; // Зняти виділення (якщо не всередині комбо)
                } else {
                    selectedPiece = { x, y };
                }
                renderBoard();
                return;
            }

            // Якщо клікнули на порожню клітинку і фігура обрана
            if (pieceVal === 0 && selectedPiece) {
                const jumps = getValidJumps(selectedPiece.x, selectedPiece.y, boardState);
                const jumpMove = jumps.find(m => m.x === x && m.y === y);

                if (jumpMove) {
                    executeMove(selectedPiece.x, selectedPiece.y, x, y, true);
                    return;
                }

                // Якщо немає обов'язкових взятть, перевіряємо звичайні ходи
                if (mustJumpPieces.length === 0 && !multiJumpSquare) {
                    const moves = getValidNormalMoves(selectedPiece.x, selectedPiece.y, boardState);
                    const normalMove = moves.find(m => m.x === x && m.y === y);
                    if (normalMove) {
                        executeMove(selectedPiece.x, selectedPiece.y, x, y, false);
                    }
                }
            }
        }

        function executeMove(sx, sy, dx, dy, isJump) {
            let wasPromoted = applyMoveAndGetPromoted(sx, sy, dx, dy);
            
            let continueTurn = false;

            // Правило "Російських шашок": якщо шашка перетворилась на дамку під час взяття,
            // вона продовжує бити цим же ходом вже за правилами дамки (прибрано !wasPromoted).
            if (isJump) {
                // Перевіряємо, чи може ЦЯ Ж шашка бити далі
                const furtherJumps = getValidJumps(dx, dy, boardState);
                if (furtherJumps.length > 0) {
                    continueTurn = true;
                    multiJumpSquare = { x: dx, y: dy };
                    selectedPiece = { x: dx, y: dy };
                    mustJumpPieces = [{ x: dx, y: dy }]; // Блокуємо вибір інших
                }
            }

            if (!continueTurn) {
                currentTurn = currentTurn === 'white' ? 'black' : 'white';
                selectedPiece = null;
                multiJumpSquare = null;
                mustJumpPieces = [];
            }

            updateGameState();
            
            // Відправляємо стан супернику, якщо це мережева гра
            if (!isLocalMode && conn) {
                conn.send({ type: 'move', board: boardState, nextTurn: currentTurn });
            }
        }

        // --- STREAMING_CHUNK: Правила шашок (Дамки, Ходи, Биття)... ---
        function applyMoveAndGetPromoted(sx, sy, dx, dy) {
            let piece = boardState[sy][sx];
            let wasPromoted = false;
            
            boardState[dy][dx] = piece;
            boardState[sy][sx] = 0;

            // Видаляємо всі збиті шашки на шляху (важливо для дамок)
            const diffX = dx - sx;
            const diffY = dy - sy;
            const dirX = Math.sign(diffX);
            const dirY = Math.sign(diffY);
            
            let cx = sx + dirX;
            let cy = sy + dirY;
            
            while (cx !== dx && cy !== dy) {
                if (boardState[cy][cx] !== 0) {
                    boardState[cy][cx] = 0;
                }
                cx += dirX;
                cy += dirY;
            }

            // Перетворення на дамку
            if (piece === 1 && dy === 0) { 
                boardState[dy][dx] = 2; // Біла
                wasPromoted = true;
            }
            if (piece === -1 && dy === 7) {
                boardState[dy][dx] = -2; // Чорна
                wasPromoted = true;
            }
            
            return wasPromoted;
        }

        function getValidJumps(startX, startY, board) {
            const piece = board[startY][startX];
            if (piece === 0) return [];
            
            const jumps = [];
            const isKing = Math.abs(piece) === 2;
            const dirs = [ {dx: 1, dy: 1}, {dx: -1, dy: 1}, {dx: 1, dy: -1}, {dx: -1, dy: -1} ];

            for (let dir of dirs) {
                if (isKing) {
                    // Логіка літаючої дамки
                    let cx = startX + dir.dx;
                    let cy = startY + dir.dy;
                    let foundEnemy = false;

                    while (cx >= 0 && cx < 8 && cy >= 0 && cy < 8) {
                        const currentPiece = board[cy][cx];
                        
                        if (currentPiece !== 0) {
                            if (Math.sign(currentPiece) === Math.sign(piece)) {
                                break; // Своя шашка - далі не можна
                            } else {
                                if (foundEnemy) break; // Дві ворожі підряд не можна
                                foundEnemy = true;
                            }
                        } else if (foundEnemy) {
                            // Порожня клітинка після ворога - сюди можна стати
                            jumps.push({ x: cx, y: cy });
                        }
                        
                        cx += dir.dx;
                        cy += dir.dy;
                    }
                } else {
                    // Звичайна шашка б'є через 1 клітинку
                    const midX = startX + dir.dx;
                    const midY = startY + dir.dy;
                    const endX = startX + dir.dx * 2;
                    const endY = startY + dir.dy * 2;

                    if (endX >= 0 && endX < 8 && endY >= 0 && endY < 8) {
                        const midPiece = board[midY][midX];
                        const endPiece = board[endY][endX];
                        
                        if (midPiece !== 0 && Math.sign(midPiece) !== Math.sign(piece) && endPiece === 0) {
                            jumps.push({ x: endX, y: endY });
                        }
                    }
                }
            }
            return jumps;
        }

        function getValidNormalMoves(startX, startY, board) {
            const piece = board[startY][startX];
            if (piece === 0) return [];

            const moves = [];
            const isKing = Math.abs(piece) === 2;
            const forwardDir = piece > 0 ? -1 : 1; // Білі вгору, чорні вниз
            
            // Для звичайної шашки тільки вперед, для дамки всі 4
            const dirs = isKing 
                ? [ {dx: 1, dy: 1}, {dx: -1, dy: 1}, {dx: 1, dy: -1}, {dx: -1, dy: -1} ]
                : [ {dx: 1, dy: forwardDir}, {dx: -1, dy: forwardDir} ];

            for (let dir of dirs) {
                if (isKing) {
                    let cx = startX + dir.dx;
                    let cy = startY + dir.dy;
                    while (cx >= 0 && cx < 8 && cy >= 0 && cy < 8) {
                        if (board[cy][cx] === 0) {
                            moves.push({x: cx, y: cy});
                        } else {
                            break; // Шлях заблоковано
                        }
                        cx += dir.dx;
                        cy += dir.dy;
                    }
                } else {
                    const cx = startX + dir.dx;
                    const cy = startY + dir.dy;
                    if (cx >= 0 && cx < 8 && cy >= 0 && cy < 8 && board[cy][cx] === 0) {
                        moves.push({x: cx, y: cy});
                    }
                }
            }
            return moves;
        }

        // Оновлює глобальний масив mustJumpPieces
        function updateMustJumpStatus() {
            mustJumpPieces = [];
            if (multiJumpSquare) {
                // Якщо ми в процесі серійного взяття, обов'язкова фігура тільки одна
                mustJumpPieces.push(multiJumpSquare);
                return;
            }

            const checkColor = isLocalMode ? currentTurn : myColor;

            for (let y = 0; y < 8; y++) {
                for (let x = 0; x < 8; x++) {
                    const piece = boardState[y][x];
                    if ((checkColor === 'white' && piece > 0) || (checkColor === 'black' && piece < 0)) {
                        if (getValidJumps(x, y, boardState).length > 0) {
                            mustJumpPieces.push({ x, y });
                        }
                    }
                }
            }
        }

        // --- STREAMING_CHUNK: Перевірка переможця... ---
        function checkWinCondition() {
            let whiteCount = 0;
            let blackCount = 0;
            let whiteHasMoves = false;
            let blackHasMoves = false;

            for (let y = 0; y < 8; y++) {
                for (let x = 0; x < 8; x++) {
                    const piece = boardState[y][x];
                    if (piece > 0) {
                        whiteCount++;
                        if (getValidNormalMoves(x, y, boardState).length > 0 || getValidJumps(x, y, boardState).length > 0) {
                            whiteHasMoves = true;
                        }
                    } else if (piece < 0) {
                        blackCount++;
                        if (getValidNormalMoves(x, y, boardState).length > 0 || getValidJumps(x, y, boardState).length > 0) {
                            blackHasMoves = true;
                        }
                    }
                }
            }

            let winner = null;
            if (whiteCount === 0 || (!whiteHasMoves && currentTurn === 'white')) winner = 'Чорні';
            if (blackCount === 0 || (!blackHasMoves && currentTurn === 'black')) winner = 'Білі';

            if (winner) {
                showModal('Кінець гри', `Перемогли ${winner}!`, true);
                if (conn) conn.send({ type: 'win', winner: winner });
            }
        }
    </script>
